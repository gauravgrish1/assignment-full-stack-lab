<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Store</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main class="container">
        <h1>Product Store</h1>

        <form id="product-form">
            <input id="name" type="text" placeholder="Product name" required>
            <input id="price" type="number" min="0" step="0.01" placeholder="Price" required>
            <input id="rating" type="number" min="0" max="5" step="0.1" placeholder="Rating" required>
            <button type="submit">Add Product</button>
        </form>

        <section id="product-list" class="product-list"></section>
    </main>

    <script src="/app.js"></script>
</body>
</html>
